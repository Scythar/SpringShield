# Application Configuration
spring.application.name=SpringShield
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:springshielddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
jwt.secret=SpringShieldSecretKeyForJWTTokenGenerationMustBe256BitsOrLonger2024
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.token-prefix=Bearer 
jwt.header-string=Authorization

# Logging Configuration
logging.level.root=INFO
logging.level.com.springshield=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Enable scheduling for token cleanup
spring.task.scheduling.pool.size=2

# Jackson configuration
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=UTC